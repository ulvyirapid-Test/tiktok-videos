<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family:K; src:url('../../fonts/KantumruyPro.ttf'); font-weight:100 900; }
:root { --bg1:#070B1A; --bg2:#151036; --ink:#F4F6FF; --mut:#A8B0D3; --acc:#22D3EE; --acc2:#A78BFA; --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --panel:rgba(255,255,255,.07); --line:rgba(255,255,255,.13); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; }
body { font-family:K, "Noto Color Emoji", sans-serif; color:var(--ink); background:#070B1A; position:relative; }
.glow { position:absolute; border-radius:50%; filter:blur(170px); }
#g1 { width:900px; height:900px; left:-320px; top:-260px; background:var(--acc); opacity:.22; }
#g2 { width:900px; height:900px; right:-360px; bottom:-200px; background:#7C3AED; opacity:.35; }
#top .brand { display:flex; align-items:center; gap:16px; } #top .brand img { width:64px; height:64px; position:relative; z-index:5; border-radius:50%; box-shadow:0 0 0 3px rgba(34,211,238,.55), 0 6px 18px rgba(0,0,0,.45); }
.cta-logo { width:190px; height:190px; border-radius:50%; box-shadow:0 0 0 5px rgba(34,211,238,.6), 0 0 40px rgba(250,204,21,.35); }
#top { position:absolute; left:72px; right:72px; top:96px; display:flex; justify-content:space-between; align-items:center; font-size:32px; font-weight:700; color:var(--mut); }
#series { color:var(--bg1); background:var(--acc); padding:6px 22px; border-radius:999px; font-size:28px; }
#bar { position:absolute; left:72px; right:72px; top:172px; height:8px; border-radius:4px; background:rgba(255,255,255,.1); }
#bar i { display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--acc),var(--acc2)); width:0; }
.scene { position:absolute; left:72px; top:215px; width:860px; height:var(--sceneh,1250px); display:flex; flex-direction:column; justify-content:center; gap:40px; opacity:0; }
.el { will-change:transform,opacity; }
.label { font-size:40px; font-weight:700; color:var(--acc); letter-spacing:1px; }
.h1 { font-size:104px; line-height:1.38; font-weight:800; }
.h2 { font-size:76px; line-height:1.45; font-weight:800; }
.h3 { font-size:54px; line-height:1.5; font-weight:700; }
.p { font-size:46px; line-height:1.6; color:var(--mut); }
.acc { color:var(--acc); } .acc2 { color:var(--acc2); } .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
.big-num { display:flex; align-items:center; gap:28px; font-size:120px; font-weight:800; }
.strike { position:relative; color:var(--mut); }
.strike::after { content:""; position:absolute; opacity:var(--so,0); left:-6px; right:var(--sr,100%); top:52%; height:12px; border-radius:6px; background:var(--bad); }
.badge { align-self:flex-start; font-size:38px; font-weight:800; background:var(--acc2); color:#14102E; padding:10px 30px; border-radius:999px; }
/* compare */
.cmp { display:flex; gap:28px; }
.col { flex:1; border-radius:36px; padding:40px 34px; background:var(--panel); border:3px solid var(--line); }
.col.good { border-color:var(--ok); background:rgba(74,222,128,.08); }
.col h4 { font-size:52px; margin-bottom:24px; }
.col li { list-style:none; font-size:40px; line-height:1.55; margin-bottom:18px; color:var(--ink); }
/* window chrome */
.win { flex-shrink:0; border-radius:34px; background:#0F1530; border:3px solid var(--line); overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.45); }
.win .tb { height:66px; display:flex; align-items:center; gap:14px; padding:0 26px; background:rgba(255,255,255,.05); font-size:30px; color:var(--mut); font-weight:700; }
.dot { width:18px; height:18px; border-radius:50%; background:#F87171; } .dot:nth-child(2){background:#FBBF24} .dot:nth-child(3){background:#4ADE80}
/* chat */
.chat { padding:34px 30px 38px; display:flex; flex-direction:column; gap:26px; min-height:560px; }
.msg { font-size:var(--msg,40px); line-height:1.6; padding:24px 30px; border-radius:30px; max-width:92%; white-space:pre-wrap; }
.msg.u { align-self:flex-end; background:#2563EB; border-bottom-right-radius:8px; }
.msg.a { align-self:flex-start; background:rgba(255,255,255,.08); border:2px solid var(--line); border-bottom-left-radius:8px; }
.who { font-size:28px; font-weight:800; color:var(--acc); margin-bottom:6px; display:block; }
.caret { display:inline-block; width:4px; height:42px; background:var(--ink); vertical-align:-8px; margin-left:4px; }
.mono { font-family:K, sans-serif; font-size:40px; font-weight:700; color:#FDE68A; letter-spacing:.5px; }
/* sheet */
.fx { display:flex; align-items:center; gap:18px; padding:16px 22px; border-bottom:2px solid var(--line); font-size:36px; min-height:76px; }
.fx b { color:var(--ok); font-style:italic; font-family:serif; font-size:40px; }
table { border-collapse:collapse; width:100%; font-size:36px; }
th { background:rgba(74,222,128,.14); color:#BBF7D0; font-weight:700; }
th, td { border:2px solid rgba(255,255,255,.1); padding:16px 18px; text-align:left; white-space:nowrap; }
td.hl { background:rgba(34,211,238,.18); }
tr.rowhl td { background:rgba(250,204,21,.24); box-shadow:inset 0 3px 0 #FACC15, inset 0 -3px 0 #FACC15; }
tr.rowbad td { background:rgba(248,113,113,.16); }
.fx .mono { white-space:pre-wrap; word-break:normal; overflow-wrap:anywhere; line-height:1.35; }
td.fill { background:rgba(74,222,128,.22); font-weight:800; color:var(--ok); }
td.res, td.resv { background:rgba(74,222,128,.25); font-weight:800; color:var(--ok); }
.bigt th, .bigt td { padding:.42em .55em; }
.rn { color:#CBD5E1; width:60px; text-align:center; font-size:30px; background:rgba(255,255,255,.04); }
/* phone */
.phone { align-self:center; width:600px; height:1000px; border-radius:70px; background:#0B1024; border:10px solid #2A3157; padding:80px 30px 30px; display:flex; flex-direction:column; gap:22px; position:relative; box-shadow:0 30px 90px rgba(0,0,0,.5); }
.phone::before { content:""; position:absolute; top:24px; left:50%; width:160px; height:34px; margin-left:-80px; border-radius:20px; background:#000; }
.ph-head { font-size:30px; color:var(--mut); text-align:center; font-weight:700; margin-bottom:6px; }
.note { background:rgba(255,255,255,.09); border-radius:28px; padding:22px 24px; font-size:32px; line-height:1.5; }
.note .nt { font-size:24px; color:var(--mut); font-weight:700; display:flex; justify-content:space-between; margin-bottom:6px; }
/* flow */
.flow { display:flex; flex-direction:column; gap:10px; }
.node { display:flex; align-items:center; gap:30px; background:var(--panel); border:3px solid var(--line); border-radius:32px; padding:28px 34px; font-size:46px; font-weight:700; }
.node .ic { font-size:64px; width:90px; text-align:center; }
.node small { display:block; font-size:32px; font-weight:400; color:var(--mut); }
.arr { text-align:center; font-size:52px; color:var(--acc2); line-height:1; height:56px; }
/* steps */
.steps { display:flex; flex-direction:column; gap:24px; }
.step { display:flex; gap:28px; align-items:center; background:var(--panel); border-radius:30px; padding:26px 30px; font-size:44px; line-height:1.5; }
.num { flex:none; width:84px; height:84px; border-radius:24px; background:var(--acc); color:var(--bg1); font-size:48px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.card { background:var(--panel); border:3px solid var(--line); border-radius:40px; padding:46px 44px; }
.handle-big { font-size:120px; font-weight:800; }
.avatar { display:flex; align-items:center; gap:26px; }
.av { flex:none; border-radius:50%; border:6px solid var(--acc); background-image:url('../../assets/creator.jpg'); background-repeat:no-repeat; box-shadow:0 12px 40px rgba(0,0,0,.45); }
.avatar .nm { font-size:44px; font-weight:800; } .avatar .sb { font-size:32px; color:var(--mut); }
.avsvg { flex:none; border-radius:50%; border:6px solid var(--acc); box-shadow:0 14px 44px rgba(0,0,0,.45); overflow:hidden; }
.avsvg svg { width:100%; height:100%; display:block; }
.photo { align-self:flex-start; width:380px; height:380px; border-radius:44px; border:6px solid var(--acc); background-image:url("../../assets/creator.jpg"); background-repeat:no-repeat; background-size:485px 485px; background-position:-76px -9px; box-shadow:0 30px 80px rgba(0,0,0,.5); }
#say { position:absolute; left:72px; width:860px; top:1290px; display:flex; gap:20px; align-items:flex-start; opacity:0; }
#say .bub { flex:1; position:relative; background:rgba(15,21,48,.92); border:3px solid var(--acc); border-radius:30px; padding:20px 28px; font-size:38px; line-height:1.55; font-weight:600; }
#say .bub::before { content:""; position:absolute; left:-16px; top:38px; width:26px; height:26px; background:rgba(15,21,48,.92); border-left:3px solid var(--acc); border-bottom:3px solid var(--acc); transform:rotate(45deg); }
#say .avsvg { border-width:4px; }

/* ---- explainer scenes ---- */

.cap { position:absolute; left:50%; margin-left:-150px; width:300px; height:150px; top:110px; border-radius:28px; background:linear-gradient(180deg,#F1F5F9,#CBD5E1); color:#0F172A; font-size:90px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 18px 0 #64748B, 0 30px 40px rgba(0,0,0,.4); }
.stem { position:absolute; left:50%; margin-left:-22px; width:44px; height:90px; top:260px; background:#94A3B8; border-radius:8px; }
.ct { position:absolute; top:380px; width:180px; height:22px; border-radius:11px; background:#FBBF24; }
.wire { position:absolute; top:388px; height:6px; background:rgba(255,255,255,.25); }

.state { position:absolute; left:0; right:0; bottom:40px; text-align:center; font-size:58px; font-weight:800; }

.mk.on { background:var(--ok); color:#052e16; border-color:var(--ok); box-shadow:0 0 40px rgba(74,222,128,.6); }
.rowscan { position:absolute; left:20px; right:20px; height:112px; border-radius:22px; border:4px solid var(--acc); box-shadow:0 0 30px var(--acc); }
.bitrow { display:flex; gap:14px; justify-content:center; }
.bit { width:92px; height:120px; border-radius:20px; border:3px solid var(--line); background:rgba(255,255,255,.05); display:flex; align-items:center; justify-content:center; font-size:72px; font-weight:800; color:var(--mut); }
.bit.one { background:var(--acc); color:var(--bg1); border-color:var(--acc); box-shadow:0 0 30px var(--acc); }
.bit.zero { color:var(--ink); }
.pv { display:flex; gap:14px; justify-content:center; font-size:26px; color:var(--mut); }
.pv span { width:92px; text-align:center; }
.bignum { font-size:84px; font-weight:800; text-align:center; }
.dev { position:absolute; top:220px; width:200px; height:200px; border-radius:36px; background:rgba(255,255,255,.08); border:3px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:90px; }
.dev small { font-size:28px; color:var(--mut); font-weight:700; margin-top:6px; }
.pxgrid { display:grid; gap:6px; }
.px { width:38px; height:38px; border-radius:6px; background:rgba(255,255,255,.06); }
.px.f { background:#F8FAFC; }
.zoom { border-radius:30px; background:rgba(15,21,48,.95); border:3px solid var(--acc); padding:26px 30px; font-size:40px; line-height:1.7; font-weight:700; }
.bar { display:inline-block; height:22px; border-radius:11px; vertical-align:middle; margin:0 14px; }
.mon { position:absolute; left:90px; top:40px; width:680px; height:440px; border-radius:26px; background:#020617; border:18px solid #1E293B; padding:30px; font-size:64px; font-weight:700; color:#0F172A; }
.mon .doc { width:100%; height:100%; background:#F8FAFC; border-radius:10px; padding:26px 30px; }
.mon-stand { position:absolute; left:380px; top:500px; width:100px; height:70px; background:#1E293B; }
.mon-base { position:absolute; left:300px; top:566px; width:260px; height:22px; border-radius:11px; background:#1E293B; }
.hz { position:absolute; right:40px; top:30px; font-size:34px; font-weight:800; color:var(--bg1); background:var(--acc); padding:6px 20px; border-radius:999px; }
#rain { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
#rain span { position:absolute; font-family:"DejaVu Sans Mono",monospace; font-weight:700; color:var(--acc); }
.packet { position:absolute; top:300px; padding:8px 16px; border-radius:14px; background:#FDE047; color:#0F172A; font-size:30px; font-weight:800; box-shadow:0 0 30px #FDE047; font-family:"DejaVu Sans Mono",monospace; }
.led { position:absolute; width:22px; height:22px; border-radius:50%; background:#334155; }
.pulse { position:absolute; left:50%; width:26px; height:26px; margin-left:-13px; border-radius:50%; background:var(--acc); box-shadow:0 0 30px var(--acc); }
.scanline { position:absolute; left:0; right:0; height:40px; background:linear-gradient(180deg,transparent,rgba(34,211,238,.25),transparent); }
.spark { position:absolute; font-size:54px; font-weight:800; color:#FDE047; text-shadow:0 0 20px #FDE047; }
.stage { height:720px !important; }

#bgs { position:absolute; inset:0; }
#bgs .bgl { position:absolute; inset:0; opacity:0; }
.g7 { display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.g7 .gi { display:flex; align-items:center; gap:22px; padding:24px 26px; border-radius:28px; background:rgba(255,255,255,.07); border:3px solid var(--line); font-size:42px; font-weight:800; }
.g7 .gi .ic { font-size:58px; } .g7 .gi small { display:block; font-size:28px; color:var(--mut); font-weight:600; }
.g7 .gi.hot { border-color:var(--acc); box-shadow:0 0 34px var(--acc); }
.box { position:absolute; border-radius:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; text-align:center; }
.lbl { position:absolute; font-size:34px; font-weight:800; }
.sock { position:absolute; border-radius:14px; border:4px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#E2E8F0; background:rgba(0,0,0,.35); }
.sock.hot { border-color:#FDE047; box-shadow:0 0 36px #FDE047; color:#FDE047; }
.node3 { position:absolute; width:230px; height:110px; margin-left:-115px; margin-top:-55px; border-radius:26px; background:rgba(255,255,255,.08); border:4px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:800; }
.node3.hot { border-color:var(--acc); background:var(--acc); color:var(--bg1); box-shadow:0 0 40px var(--acc); }
.core { width:64px; height:64px; border-radius:14px; background:rgba(255,255,255,.1); border:3px solid var(--line); }
.core.on { background:var(--acc); box-shadow:0 0 24px var(--acc); }
.zone { position:absolute; top:70px; width:360px; height:520px; border-radius:30px; border:4px dashed rgba(255,255,255,.25); }
.zone h5 { position:absolute; top:-58px; left:0; right:0; text-align:center; font-size:36px; font-weight:800; }
.item { position:absolute; width:300px; height:84px; border-radius:20px; background:#F8FAFC; color:#0F172A; font-size:34px; font-weight:800; display:flex; align-items:center; gap:14px; padding:0 20px; box-shadow:0 10px 24px rgba(0,0,0,.4); }
.flash { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.5; font-size:58px; font-weight:800; color:#FDE047; background:rgba(0,0,0,.55); border-radius:36px; opacity:0; }
.chk { display:flex; align-items:center; gap:24px; font-size:46px; font-weight:700; padding:16px 0; border-bottom:2px solid var(--line); }
.chk .bx { width:64px; height:64px; border-radius:16px; border:4px solid var(--mut); display:flex; align-items:center; justify-content:center; font-size:44px; color:transparent; }
.chk.ok .bx { background:var(--ok); border-color:var(--ok); color:#052e16; }
.race { display:flex; flex-direction:column; gap:40px; }
.rrow { display:flex; align-items:center; gap:22px; font-size:40px; font-weight:800; }
.rrow .nm { width:170px; } .rrow .tr { flex:1; height:56px; border-radius:28px; background:rgba(255,255,255,.08); overflow:hidden; } .rrow .tr i { display:block; height:100%; border-radius:28px; }
.dotgrid { display:grid; gap:7px; }
.dg { width:18px; height:18px; border-radius:5px; background:rgba(255,255,255,.1); }

/* ---- telegram / tools scenes ---- */
.mono2 { font-family:"DejaVu Sans Mono", K, monospace; color:#FDE68A; font-size:.88em; word-break:break-all; }
.tgw { position:relative; border-radius:34px; overflow:hidden; background:#0E1621; border:3px solid rgba(255,255,255,.12); box-shadow:0 30px 80px rgba(0,0,0,.45); flex-shrink:0; }
.tgh { display:flex; align-items:center; gap:20px; padding:16px 26px; background:#17212B; }
.tgh .ic { width:76px; height:76px; border-radius:50%; background:linear-gradient(135deg,#38BDF8,#2563EB); display:flex; align-items:center; justify-content:center; font-size:42px; flex:none; }
.tgh .nm { font-size:36px; font-weight:800; } .tgh .sb { font-size:26px; color:#7D8E9E; }
.tgb { position:relative; height:var(--tgh,720px); overflow:hidden; }
.tgin { position:absolute; left:0; right:0; top:0; padding:24px 22px; display:flex; flex-direction:column; gap:18px; }
.tm { max-width:86%; padding:14px 22px 10px; border-radius:26px; font-size:32px; line-height:1.5; white-space:pre-wrap; word-break:break-word; opacity:0; }
.tm.me { align-self:flex-end; background:#2B5278; border-bottom-right-radius:8px; }
.tm.them { align-self:flex-start; background:#182533; border-bottom-left-radius:8px; }
.tm .wh { display:block; font-size:26px; font-weight:800; margin-bottom:2px; }
.tm .tt { display:block; text-align:right; font-size:21px; color:#7D8E9E; margin-top:2px; }
.tm.hl { box-shadow:0 0 0 4px var(--acc), 0 0 40px var(--acc); }
.tm .btn { display:block; margin-top:10px; text-align:center; background:rgba(255,255,255,.08); border-radius:14px; padding:8px; color:#7DD3FC; font-weight:700; }
.code { padding:22px 24px 90px; font-family:"DejaVu Sans Mono", K, monospace; font-size:var(--cs,25px); line-height:1.55; color:#E2E8F0; white-space:pre-wrap; word-break:break-all; }
.code .ln { display:block; min-height:1.55em; border-radius:8px; padding:0 8px; }
.code .ln.c { color:#64748B; } .code .ln.hl { background:rgba(250,204,21,.2); box-shadow:inset 5px 0 0 #FACC15; }
.urlb { flex:1; margin-left:10px; background:rgba(255,255,255,.08); border-radius:999px; padding:6px 22px; font-size:24px; color:#E2E8F0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:"DejaVu Sans Mono", K, monospace; }
.toast { position:absolute; left:22px; right:22px; bottom:20px; padding:16px 22px; border-radius:18px; background:#14532D; border:2px solid #22C55E; color:#BBF7D0; font-size:30px; font-weight:800; opacity:0; }
.mbar { display:flex; gap:2px; padding:12px 14px; font-size:27px; color:#CBD5E1; border-bottom:2px solid var(--line); white-space:nowrap; }
.mbar span { padding:6px 9px; border-radius:10px; } .mbar span.on { background:rgba(255,255,255,.16); color:#fff; }
.dd { position:absolute; min-width:330px; background:#1E293B; border:2px solid var(--line); border-radius:18px; padding:10px 0; box-shadow:0 20px 50px rgba(0,0,0,.5); opacity:0; z-index:3; }
.dd div { padding:14px 26px; font-size:32px; white-space:nowrap; } .dd div.on { background:rgba(56,189,248,.28); color:#fff; }
.sidel { position:absolute; left:0; top:66px; bottom:0; width:300px; background:rgba(255,255,255,.04); border-right:2px solid var(--line); padding-top:18px; }
.sidel div { padding:16px 22px; font-size:30px; white-space:nowrap; border-radius:0 999px 999px 0; margin-right:14px; } .sidel div.on { background:rgba(56,189,248,.28); color:#fff; }
.faint { position:absolute; left:20px; right:20px; bottom:20px; border-radius:16px; background-image:linear-gradient(rgba(255,255,255,.06) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.06) 2px, transparent 2px); background-size:120px 48px; }
.res { position:absolute; left:0; right:0; top:66px; bottom:0; background:#0B1020; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; opacity:0; font-size:44px; font-weight:800; text-align:center; z-index:4; }
.res .big { font-size:120px; }
.cur { position:absolute; left:0; top:0; width:58px; height:58px; z-index:9; pointer-events:none; filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)); }

const SEG = new Intl.Segmenter('km', {granularity:'grapheme'});
const graphemes = s => Array.from(SEG.segment(s), x => x.segment);
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// mini markup: *text* -> accent, _text_ -> accent2, ~text~ -> ok, !text! -> warn
const mk0 = s => esc(s).replace(/\*(.+?)\*/g,'<span class=acc>$1</span>').replace(/_(.+?)_/g,'<span class=acc2>$1</span>').replace(/~(.+?)~/g,'<span class=ok>$1</span>').replace(/!(.+?)!/g,'<span class=warn>$1</span>').replace(/\n/g,'<br>');

const mk1 = s => s.split('`').map((p,i) => i % 2 ? `<span class=mono2>${esc(p)}</span>` : mk0(p)).join('');
const mk = s => String(s).split(/\[\[(.+?)\]\]/).map((p,i) => i % 2 ? `<span class=chip>${esc(p)}</span>` : mk1(p)).join('');
function pop(el, p, dy=40) { el.style.opacity = clamp(p*1.6); el.style.transform = `translateY(${(1-ease(p))*dy}px) scale(${0.94 + 0.06*back(p)})`; }
function typeInto(el, full, p, caret) {
  const g = graphemes(full), n = Math.round(g.length * clamp(p));
  el.textContent = g.slice(0, n).join('');
  if (caret && p > 0 && p < 1) el.appendChild(h('span','caret'));
}

let AVN = 0;
function avatarEl(size) { const e = h('div','avsvg'); e.style.width = e.style.height = size + 'px'; e.innerHTML = AV_SVG.replace(/CLIP/g, 'clip' + AVN).replace(/"BG"/g, '"bg' + AVN + '"').replace(/url\(#BG\)/g, 'url(#bg' + AVN + ')'); AVN++; return e; }
const VOFF = 0.15;
function talkNow(sc, lt, fallback) { return sc.talk != null ? (lt > VOFF && lt < VOFF + sc.talk) : fallback; }
function animateAvatar(el, t, talk) {
  const head = el.querySelector('.head'), eyes = el.querySelector('.eyes'), mouth = el.querySelector('.mouth'), arm = el.querySelector('.arm'), body = el.querySelector('.body');
  const bob = Math.sin(t * 2.4) * 4, tilt = Math.sin(t * 1.3) * 3;
  head.setAttribute('transform', `translate(0 ${bob}) rotate(${tilt} 200 260)`);
  body.setAttribute('transform', `translate(0 ${bob * 0.4})`);
  const blink = (t % 3.2) < 0.13 ? 0.12 : 1;
  eyes.setAttribute('transform', `translate(0 ${184 * (1 - blink)}) scale(1 ${blink})`);
  const open = talk ? Math.max(0, Math.sin(t * 16)) * (Math.sin(t * 1.9) > -0.4 ? 1 : 0) : 0;
  mouth.setAttribute('ry', (open * 10).toFixed(1));
  arm.setAttribute('transform', `rotate(${(Math.sin(t * 9) * 16).toFixed(1)} 318 420)`);
}

const CUR_SVG = '<svg viewBox="0 0 24 24" width="58" height="58"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.6 L11 14 L18 14 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/></svg>';
function rel(el, anc) { let x = 0, y = 0; while (el && el !== anc) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return {x, y}; }
function center(el, anc) { const p = rel(el, anc); return {x: p.x + el.offsetWidth / 2, y: p.y + el.offsetHeight / 2}; }
function addCursor(anc) { const c = h('div','cur', CUR_SVG); const r = h('div','ring'); anc.append(r, c); return {c, r}; }
// keys: [{t, x, y, click?}] ; cursor tip at (x,y)
function driveCursor(cu, keys, lt) {
  let x = keys[0].x, y = keys[0].y;
  for (let i = 1; i < keys.length; i++) { const a = keys[i-1], b = keys[i]; if (lt >= b.t) { x = b.x; y = b.y; continue; } if (lt > a.t) { const q = ease((lt - a.t) / (b.t - a.t)); x = a.x + (b.x - a.x) * q; y = a.y + (b.y - a.y) * q; } break; }
  cu.c.style.transform = `translate(${x - 6}px, ${y - 4}px)`; cu.c.style.opacity = lt > keys[0].t ? 1 : 0;
  let ring = 0; keys.forEach(k => { if (k.click && lt > k.t && lt < k.t + 0.5) ring = (lt - k.t) / 0.5; });
  cu.r.style.left = x + 'px'; cu.r.style.top = y + 'px'; cu.r.style.opacity = ring ? 1 - ring : 0; cu.r.style.transform = `scale(${0.4 + ring})`;
}
const SPAN = (s, f = 0.85, lo = 3) => Math.max(lo, (s.talk || 4) * f);
const BUILD = {
  hook(s) {
    const root = h('div','scene'); const items = [];
    if (window.AVATAR) { const a = h('div','avatar el'); a.append(avatarEl(240)); a.append(h('div','', `<div class=nm>@ulvyi</div><div class=sb>${esc(window.SERIES || 'AI សម្រាប់ការងារ')}</div>`)); root.append(a); items.push(a); }
    if (s.notify) { root._ntf = [].concat(s.notify).map(x => { const n = h('div','ntf el', `<div class=ic>${x.icon || '🤖'}</div><div><div class=nm>${esc(x.bot || 'Bot')}${x.time === '' ? '' : ' · ' + esc(x.time || 'now')}</div><div class=tx>${mk(x.t)}</div></div>`); root.append(n); return n; }); }
    if (s.badge) { const b = h('div','badge el', esc(s.badge)); root.append(b); items.push(b); }
    for (const l of s.lines) { const e = h('div', (l.cls||'h1') + ' el', mk(l.t)); root.append(e); items.push(e); }
    if (s.from && s.to) {
      const row = h('div','big-num el'); const a = h('span','strike', esc(s.from)); const ar = h('span','acc2','→'); const b = h('span','ok', esc(s.to));
      row.append(a, ar, b); root.append(row); items.push(row); root._strike = a; root._to = b;
    }
    root._items = items; return root;
  },
  compare(s) {
    const root = h('div','scene'); const t = h('div','h2 el', mk(s.title)); const cmp = h('div','cmp');
    const mkcol = (c, good) => { const col = h('div','col el' + (good?' good':'')); col.append(h('h4', good?'ok':'bad', esc(c.title))); const ul = h('ul'); c.items.forEach(x => ul.append(h('li','el', mk(x)))); col.append(ul); return col; };
    const L = mkcol(s.left,false), R = mkcol(s.right,true); if (s.neutral) { L.querySelector('h4').className = 'acc'; R.querySelector('h4').className = 'acc2'; R.classList.remove('good'); } cmp.append(L, R); root.append(t, cmp);
    root._items = [t, L, ...L.querySelectorAll('li'), R, ...R.querySelectorAll('li')]; return root;
  },
  sheet(s) {
    const root = h('div','scene'); const items = [];
    if (s.title) { const t = h('div','h3 el', mk(s.title)); root.append(t); items.push(t); }
    const w = h('div','win el'); w.append(h('div','tb','<span class=dot></span><span class=dot></span><span class=dot></span>&nbsp;' + esc(s.file || 'Sheet')));
    const fx = h('div','fx','<b>fx</b>'); const fxt = h('span','mono'); if (s.fxSize) fxt.style.fontSize = s.fxSize + 'px'; fx.append(fxt); w.append(fx); if (s.fs) w.style.setProperty('--fs', s.fs);
    const tb = h('table'); const tr0 = h('tr'); tr0.append(h('th','rn','')); s.cols.forEach(c => tr0.append(h('th','',esc(c)))); tb.append(tr0);
    const rowsEl = [];
    s.rows.forEach((r,i) => { const tr = h('tr'); tr.append(h('td','rn', String(i+2))); r.forEach((c,j) => { const td = h('td', (s.hlCol===j && s.hlVal===c)?'hl':'', esc(String(c))); tr.append(td); }); tb.append(tr); rowsEl.push(tr); });
    const fillTds = s.fill ? rowsEl.map(tr => tr.children[s.fillCol + 1]) : [];
    let resTd = null;
